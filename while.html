<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="demo"></h1>
    <script>
        let i = 1;
        while (i <= 5) {
            document.getElementById("demo").innerHTML += "Iteration: " + i + "<br>";
            i++;
        }
    </script>
</body>
</html>
