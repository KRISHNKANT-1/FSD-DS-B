<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
    <style>
        
            img{
                width: 100px;
                height: 100px;
            }
        
        table{
            width: 80%;
            margin:auto;
            padding:10px;
            font-size: 25px;
            color: bisque;
            border: 2px solid black;
            background-color: black;
        }
    </style>
</head>
<body>
    <table>
        <thead> <tr>
            <th>S.no</th>
            <th>Image </th>
            <th>Title</th>
            <th>Price</th>
            <th>Category</th>
        </tr></thead>
        <tbody id="data">
        
        </tbody>

    </table>
    <script>
        const ele = document.getElementById("data");
        const url="https://dummyjson.com/products";
        async function loadData(){
            try{
            const res = await fetch(url);//convert into string
            const data = await res.json();//convert string in to json
            console.log( "DATA",data.products);
            let row ="";
            data.products.map((i,index)=>{
                row += `<tr>
                <td>${index+1}</td>
                <td><img src="${i.images[0]}" ></td>
                <td>${i.title}</td>
                <td>${i.price}</td>
                <td>${i.category}</td>
                </tr>`;
                ele.innerHTML=row;
            })
            
        }
        catch(err){
            console.log("Error:", err);
        }
    }
    loadData();
    </script>
</body>
</html>
